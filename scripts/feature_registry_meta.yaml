# Common LLM hallucinations and their corrections
common_mistakes:
  description: "Frequently hallucinated constructs that don't exist - and their correct alternatives"
  docs: "docs/CHEATSHEET.md"
  items:
    - wrong: "type: CommandBar"
      correct: "type: UsualGroup with group_type: CommandBar"
      explanation: "CommandBar is not a separate element type, use UsualGroup"
    - wrong: "type: FormGroup"
      correct: "type: UsualGroup"
      explanation: "FormGroup doesn't exist, use UsualGroup with group_direction"
    - wrong: "type: TextBox"
      correct: "type: InputField"
      explanation: "TextBox is not a 1C term, use InputField"
    - wrong: "type: Label"
      correct: "type: LabelField or type: LabelDecoration"
      explanation: "Use LabelField for data-bound, LabelDecoration for static text"
    - wrong: "type: Image"
      correct: "type: PictureDecoration or type: PictureField"
      explanation: "Use PictureDecoration for static, PictureField for editable"
    - wrong: "type: Grid"
      correct: "type: Table"
      explanation: "Grid/DataGrid doesn't exist, use Table"
    - wrong: "type: Tab or type: TabControl"
      correct: "type: Pages"
      explanation: "Tabs are called Pages in 1C"
    - wrong: "type: Dropdown or type: ComboBox"
      correct: "type: InputField with choice_list"
      explanation: "Use InputField with choice_list for dropdown behavior"
    - wrong: "event: OnClick"
      correct: "event: Click"
      explanation: "The event is called Click, not OnClick (OnClick is for HTMLDocumentField only)"
    - wrong: "event: OnRowActivate"
      correct: "event: OnActivateRow"
      explanation: "Correct event name is OnActivateRow"
