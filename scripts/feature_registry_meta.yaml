        - "--handlers-file: Monolithic BSL file with handlers"
        - "--handlers: Directory with handler files"
        - "--output: Output directory"
        - "--output-format: xml or epf (default: xml)"
        - "--validate: Validate EPF after generation"
        - "--dry-run: Validate without creating files"
