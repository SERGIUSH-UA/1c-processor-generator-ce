name: Tests

on:
  push:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  # Quick test on push - тільки Linux + 1 Python версія
  quick-test:
    name: Quick Test (Python 3.12)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libcairo2-dev libgirepository1.0-dev
        pip install --upgrade pip
        pip install -r 1c_processor_generator/requirements.txt
        pip install pytest pytest-cov cairosvg Pillow

    - name: Run tests
      env:
        PYTHONIOENCODING: utf-8
      run: pytest tests/ -v --tb=short

  # Full matrix тільки для PR або manual trigger
  full-test:
    name: Test Py${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        # Linux - всі версії (дешевше)
        # Windows - тільки 3.12 (основна версія)
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.12'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libgirepository1.0-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r 1c_processor_generator/requirements.txt
        pip install pytest pytest-cov cairosvg Pillow

    - name: Run tests with coverage
      env:
        PYTHONIOENCODING: utf-8
      run: pytest tests/ -v --cov=1c_processor_generator --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Тільки для PR

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install & run linters
      run: |
        pip install flake8 black isort
        black --check 1c_processor_generator/ tests/ || true
        isort --check-only 1c_processor_generator/ tests/ || true
        flake8 1c_processor_generator/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

  version-check:
    name: Version Sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Тільки для PR

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python scripts/check_version_sync.py

  build-pro:
    name: Build PRO (.pyd) - Py${{ matrix.python-version }}
    runs-on: windows-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build & test PRO module
      run: |
        pip install Cython>=3.0 setuptools wheel
        python setup_pro.py
        cd 1c_processor_generator/pro
        python -c "import constants; print(constants.LICENSE_API_URL)"

    - uses: actions/upload-artifact@v4
      with:
        name: pro-pyd-py${{ matrix.python-version }}
        path: 1c_processor_generator/pro/*.pyd
        retention-days: 30
