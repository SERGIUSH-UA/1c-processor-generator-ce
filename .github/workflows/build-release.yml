name: Build Multi-Version Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 2.60.0)'
        required: false
        default: ''

# Permissions for creating releases
permissions:
  contents: write

jobs:
  # =============================================================================
  # Build .pyd files for each Python version and architecture
  # =============================================================================
  build-pyd:
    name: Build - Python ${{ matrix.python }} - ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        arch: ['x64', 'x86']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }} (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          allow-prereleases: true

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython>=3.0 setuptools wheel

      - name: Determine platform tag
        id: platform
        shell: pwsh
        run: |
          $platTag = if ('${{ matrix.arch }}' -eq 'x64') { 'win_amd64' } else { 'win32' }
          $pyTag = "cp$('${{ matrix.python }}'.Replace('.', ''))"
          echo "platform_tag=$platTag" >> $env:GITHUB_OUTPUT
          echo "python_tag=$pyTag" >> $env:GITHUB_OUTPUT

      - name: Build _protected.pyd
        run: python _build/setup_protected.py

      - name: Build PRO modules (obfuscated)
        run: python _build/setup_pro.py --obfuscate

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $pyTag = "${{ steps.platform.outputs.python_tag }}"
          $platTag = "${{ steps.platform.outputs.platform_tag }}"
          $outDir = "artifacts/$platTag/$pyTag"

          New-Item -ItemType Directory -Force -Path $outDir
          New-Item -ItemType Directory -Force -Path "$outDir/pro"

          # Copy _protected.pyd
          $protectedPyd = Get-ChildItem "1c_processor_generator/_protected*.pyd" | Select-Object -First 1
          if ($protectedPyd) {
            Copy-Item $protectedPyd.FullName "$outDir/_protected.pyd"
            Write-Host "Copied: $($protectedPyd.Name) -> $outDir/_protected.pyd"
          } else {
            Write-Error "_protected.pyd not found!"
            exit 1
          }

          # Copy PRO .pyd files
          $proFiles = Get-ChildItem "1c_processor_generator/pro/*.pyd"
          foreach ($file in $proFiles) {
            Copy-Item $file.FullName "$outDir/pro/"
            Write-Host "Copied: $($file.Name)"
          }

          Write-Host "Total PRO files: $($proFiles.Count)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyd-${{ matrix.python }}-${{ matrix.arch }}
          path: artifacts/
          retention-days: 7

  # =============================================================================
  # Package release with all .pyd versions
  # =============================================================================
  package-release:
    name: Package Release
    needs: build-pyd
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-pyds/
          pattern: pyd-*
          merge-multiple: true

      - name: Organize artifacts
        run: |
          mkdir -p dist/multi_version_pyds
          # Move all downloaded artifacts to expected location
          cp -r all-pyds/* dist/multi_version_pyds/ || true

          echo "=== Collected .pyd files ==="
          find dist/multi_version_pyds -name "*.pyd" -type f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 1c_processor_generator/requirements.txt

      - name: Build release package
        run: |
          python _build/build_release.py --use-prebuilt-pyds --skip-compile

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract from tag (v2.60.0 -> 2.60.0)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Extract from VERSION file
            VERSION=$(grep "DEV_VERSION=" VERSION | cut -d'=' -f2)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create release ZIP
        run: |
          cd dist
          zip -r "../1c_processor_generator_pro-${{ steps.version.outputs.version }}.zip" 1c_processor_generator_pro/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: "1c_processor_generator_pro-${{ steps.version.outputs.version }}.zip"
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "1c_processor_generator_pro-${{ steps.version.outputs.version }}.zip"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # Build wheels for PyPI (one per Python version x architecture)
  # =============================================================================
  build-wheels:
    name: Build Wheel - Python ${{ matrix.python }} - ${{ matrix.arch }}
    needs: build-pyd
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        arch: ['x64', 'x86']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts for this version
        uses: actions/download-artifact@v4
        with:
          name: pyd-${{ matrix.python }}-${{ matrix.arch }}
          path: artifacts/

      - name: Set up Python ${{ matrix.python }} (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          allow-prereleases: true

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Determine platform tag
        id: platform
        shell: pwsh
        run: |
          $platTag = if ('${{ matrix.arch }}' -eq 'x64') { 'win_amd64' } else { 'win32' }
          $pyTag = "cp$('${{ matrix.python }}'.Replace('.', ''))"
          echo "platform_tag=$platTag" >> $env:GITHUB_OUTPUT
          echo "python_tag=$pyTag" >> $env:GITHUB_OUTPUT

      - name: Copy .pyd files to package
        shell: pwsh
        run: |
          $platTag = "${{ steps.platform.outputs.platform_tag }}"
          $pyTag = "${{ steps.platform.outputs.python_tag }}"
          $srcDir = "artifacts/$platTag/$pyTag"

          # Copy _protected.pyd
          Copy-Item "$srcDir/_protected.pyd" "1c_processor_generator/_protected.pyd" -Force
          Write-Host "Copied _protected.pyd"

          # Copy PRO .pyd files
          Get-ChildItem "$srcDir/pro/*.pyd" | ForEach-Object {
            Copy-Item $_.FullName "1c_processor_generator/pro/" -Force
            Write-Host "Copied $($_.Name)"
          }

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*.whl
          retention-days: 30

  # =============================================================================
  # Publish to PyPI (optional, on tag push)
  # =============================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && false  # Disabled by default
    environment: pypi

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels/
          pattern: wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          password: ${{ secrets.PYPI_API_TOKEN }}
