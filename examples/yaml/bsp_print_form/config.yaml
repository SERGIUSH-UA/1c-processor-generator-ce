# BSP Print Form Example (v2.57.0+ PRO Feature)
#
# This example generates an external print form compatible with
# 1C Standard Subsystems Library (БСП).
#
# The generated processing will include:
# - СведенияОВнешнейОбработке() - BSP registration function
# - Печать() - Print handler procedure
# - ПечатьСчетНаОплату() - your implementation from handlers.bsl
#
# Generate:
#   python -m 1c_processor_generator yaml \
#     --config config.yaml \
#     --handlers-file handlers.bsl \
#     --output output
#
# Without --handlers-file the generator emits a TODO stub instead and warns
# about it: the .epf would compile and open, but print an empty document.
#
# PRO License Required!

languages: [ru, uk, en]

processor:
  name: ПечатьСчетНаОплату
  synonym: "Печатная форма счета на оплату | Друкована форма рахунку на оплату | Invoice Print Form"

# BSP Integration Configuration
bsp:
  type: print_form
  version: "1.0"
  safe_mode: true
  information: Внешняя печатная форма счета на оплату для документов СчетНаОплатуПокупателю

  # Target documents for print form
  targets:
    - Документ.СчетНаОплатуПокупателю
    - Документ.РеализацияТоваровУслуг

  # Print commands
  commands:
    - id: СчетНаОплату
      title: "Счет на оплату | Рахунок на оплату | Invoice"
      usage: server_method
      modifier: ПечатьMXL
      show_notification: false
      template_name: ПФ_MXL_СчетНаОплату

    # Note: Word/ActiveDocument output is NOT supported by the generated Печать()
    # procedure - every command handler must return a ТабличныйДокумент.
    # See docs/LLM_BSP_PRINT_FORMS.md, Pattern 4.

# Note: Templates (макети) are optional - you can add them later
# templates:
#   - name: ПФ_MXL_СчетНаОплату
#     type: SpreadsheetDocument
#     file: templates/invoice.mxl

# No form is needed for print_form type - BSP uses ObjectModule directly
