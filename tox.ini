# Tox configuration for testing on multiple Python versions
# Install: pip install tox
# Run: tox (all environments) or tox -e py311 (specific version)

[tox]
envlist = py{38,39,310,311}, lint, coverage
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    jinja2>=3.1.0
    pyyaml>=6.0
    jsonschema>=4.0.0
commands =
    pytest tests/ -v {posargs}

[testenv:coverage]
description = Run tests with coverage report
deps =
    {[testenv]deps}
commands =
    pytest tests/ --cov=1c_processor_generator --cov-report=term-missing --cov-report=html --cov-report=xml

[testenv:lint]
description = Run code quality checks
deps =
    flake8>=7.0.0
    black>=24.3.0
    isort>=5.13.0
commands =
    black --check 1c_processor_generator/ tests/
    isort --check-only 1c_processor_generator/ tests/
    flake8 1c_processor_generator/ tests/ --max-line-length=120 --extend-ignore=E203,W503

[testenv:format]
description = Auto-format code with black and isort
deps =
    black>=24.3.0
    isort>=5.13.0
commands =
    black 1c_processor_generator/ tests/
    isort 1c_processor_generator/ tests/

[testenv:clean]
description = Clean up generated files
deps =
skip_install = true
commands =
    python -c "import shutil; shutil.rmtree('.tox', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.pytest_cache', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('htmlcov', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('1c_processor_generator.egg-info', ignore_errors=True)"
    python -c "import pathlib; [f.unlink() for f in pathlib.Path('.').rglob('*.pyc')]"
    python -c "import pathlib; [f.unlink() for f in pathlib.Path('.').rglob('.coverage')]"

[flake8]
max-line-length = 120
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .tox,
    .eggs,
    *.egg,
    build,
    dist,
    .venv,
    venv

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
